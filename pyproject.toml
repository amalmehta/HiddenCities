[project]
name = "hidden-cities"
version = "0.1.0"
description = "Hidden Cities: ranking unrecorded ancient Maya settlement clusters in NASA G-LiHT lidar"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "rasterio==1.4.2",
  "shapely==2.0.6",
  "pyproj==3.7.0",
  "pillow==11.0.0",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
